<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Shoe Store using JS</title>
</head>
<body>
    <header class="main-header">
        <div class="top-header top-container">
            <div class="header-left">
                <button class="menu-toggle" aria-label="Toggle Navigation">
                    <span></span>
                </button>
                <a class="logo" href="/">
                    <img src="assets/logo%20and%20icons/newLogo.webp" alt="JS Portfolio Logo" width="170">
                </a>
            </div>
            
            <div class="header-search">
                <form class="search-form" id="store-search-form" method="get">
                    <div class="search-input-wrapper">
                        <input type="text" name="q" id="search-query" placeholder="Search product..." autocomplete="off" class="search-input">
                        <button type="submit" title="Search" class="search-btn" aria-label="Search">
                            <img src="assets/logo%20and%20icons/search.png" alt="Search" class="search-icon">
                        </button>
                    </div>
                </form>
            </div>

            <div class="responsive-main-header">
                <div class="header-right">
                    <div class="main-header-right">
                        <a href="/account" class="nav-link custom-account-link">Account</a>
                    </div>
                    <div class="h-search h-panel">
                        <a href="/wishlist" class="nav-link icon-wishlist">Wishlist</a>
                        <div class="block block-search"></div>
                    </div>
                    <div data-block="mini-cart" class="minicart-wrapper">
                        <a href="/cart" class="nav-link showcart">
                            Cart<span class="cart-counter">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </div> <!-- FIXED: Removed the two rogue duplicate closing divs from here -->

        <div class="announcement-container banner">
            <img class="annoucement-icon" width="20" height="20" src="assets/logo%20and%20icons/discount-tag.png">
            <p>Get 20% off your first purchase on Foot Locker. Use code WELCOME20 🎉</p>
            <a href="first-purchase-discount" target="_blank" class="announcements__cta-btn announcement btn">Get Started</a>
        </div>

        <div class="bottom-container bottom-header">
            <div class="header-menu bottom-navigation">
                <nav class="desktop-nav" role="menu" id="desktopMenu">
                    <!-- FIXED: Changed wrapper to <ul> and changed duplicate IDs to classes -->
                    <ul class="nav-item menu-item">
                        <li class="ui-menu-item sale-item">
                            <a href="https://New-arrivals" class="ui-menu-item-wrapper">
                                <span>New Arrivals</span>
                            </a> 
                        </li>
                        <li class="ui-menu-item sale-item">
                            <a href="https://Sale" class="ui-menu-item-wrapper">
                                <span>Sale</span>
                            </a> 
                        </li>
                        <li class="ui-menu-item sale-item">
                            <a href="https://Wishlist" class="ui-menu-item-wrapper">
                                <span>WishList</span>
                            </a> 
                        </li>
                        <li class="ui-menu-item sale-item">
                            <a href="https://Cart" class="ui-menu-item-wrapper">
                                <span>Cart</span>
                            </a> 
                        </li>
                    </ul>
                </nav>
                <nav class="mobile-nav" id="mobileMenu">
                    <div class="drawer-header">
                        <h3>Menu</h3>
                        <button class="menu-close" id="menuClose" aria-label="Close Navigation">&times;</button>
                    </div>
                    <ul class="menu-links">
                        <li><a href="/">Home</a></li>
                        <li><a href="/shop">Shop</a></li>
                        <li><a href="/categories">Categories</a></li>
                        <li><a href="/contact">Contact</a></li>
                    </ul>
                </nav>
                <div class="menu-overlay" id="menuOverlay"></div>
            </div>
        </div>
    </header>

    <div class="product-shoes-container product-title">
        <img class="product-shoes product-type" src="assets/logo%20and%20icons/shoes-screenshot.png">
    </div> 

    <main id="maincontent" class="main-page shop-layout">
        <div class="column-main shop main-shop">
                <aside class="shop-sidebar">
                    <h3>Filters</h3>
                    <p>Sidebar Controls</p>
                </aside>
                <!-- FIXED: Changed inner main to a div to prevent double-main tags error -->
                <div id="product-grid" class="product-grid"></div>
            </div>
    </main>

    <h1 class="page-title" id="page-title-heading">
        <span class="base" data-ui-id="page-title-wrapper">because<br>legends<br>never fade</span>
    </h1>
yt
    <script src="products.js"></script>
</body>
</html>
