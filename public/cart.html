<!-- cart.html -->
<div id="side-cart-drawer" style="position: fixed; top: 0; right: -400px; width: 400px; height: 100%; background: #fff; box-shadow: -2px 0 10px rgba(0,0,0,0.15); transition: right 0.3s ease; z-index: 9999; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;">
    
    <!-- Drawer Title Block -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px;">
        <h3 style="margin: 0; font-size: 1.2rem;">🛍️ Shopping Cart</h3>
        <button id="cart-drawer-close" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; font-weight: bold;">&times;</button>
    </div>

    <!-- ⚡ Dynamic Line Items Container (Wiped and filled via your JS loop) -->
    <div id="cart-items-container" class="cart-items-content" style="flex-grow: 1; overflow-y: auto; padding-right: 5px;"></div>

    <!-- Drawer Footer, Totals, and Checkout Triggers -->
    <div style="border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.1rem; font-weight: bold;">
            <span>Subtotal:</span>
            <span id="cart-subtotal-display">₱0.00</span>
        </div>

        <!-- 🔥 Official PayPal Iframe Mounting Spot -->
        <!-- Kept completely outside the line-items loop so updates won't crash the frames! -->
        <div id="digital-wallet-buttons-container" style="margin-bottom: 15px;">
            <h4 style="margin: 0 0 10px 0; font-size: 0.85rem; color: #555; text-transform: uppercase; letter-spacing: 0.5px;">Express Checkout</h4>
            <div id="paypal-express-cart-mount-point"></div>
        </div>

        <a href="/checkout.html" style="display: block; width: 100%; padding: 14px; background: #000; color: #fff; text-align: center; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 0.95rem; box-sizing: border-box;">
            PROCEED TO CHECKOUT
        </a>
    </div>
</div>
